<!doctype html><html><meta name="viewport" content="width=device-width,initial-scale=1"><title>Local layout QA</title><style>body{margin:0;font:14px sans-serif;background:#ddd}header{position:sticky;top:0;z-index:2;background:white;padding:8px;display:flex;flex-wrap:wrap;gap:5px}iframe{border:0;transform-origin:top left}select,button{padding:6px}</style><header><select id="size"><option>390</option><option>320</option><option>1440</option></select><select id="route"><option>/zh/</option><option>/en/</option><option>/zh/cards/</option><option>/en/cards/</option><option>/zh/cards/garen/</option><option>/zh/cards/anivia/</option><option>/en/cards/anivia/</option><option>/zh/cards/zap/</option><option>/en/overview/</option><option>/en/cards/voidfish_ranged_army/</option></select><button id="load">Load</button><button id="inspect">Inspect layout</button><output id="report"></output></header><iframe id="frame" title="Layout preview"></iframe><script>function load(){report.removeAttribute('data-ready');let w=+size.value;frame.style.width=w+'px';frame.style.height='1000px';frame.style.transform='scale('+Math.min(1,(innerWidth-4)/w)+')';frame.src=route.value;frame.onload=()=>{frame.contentWindow.scrollTo(0,0);inspect.click()}}document.querySelector('#load').onclick=load;inspect.onclick=()=>{let d=frame.contentDocument;report.setAttribute('data-ready','true');report.textContent=JSON.stringify({width:frame.contentWindow.innerWidth,overflow:d.documentElement.scrollWidth>d.documentElement.clientWidth,broken:[...d.images].filter(i=>i.complete&&!i.naturalWidth).length,client:d.documentElement.clientWidth,scroll:d.documentElement.scrollWidth,offenders:[...d.querySelectorAll('*')].filter(e=>e.getBoundingClientRect().right>d.documentElement.clientWidth+1).slice(0,8).map(e=>e.tagName+'.'+e.className)})};load()</script></html>
